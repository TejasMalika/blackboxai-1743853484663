<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | Shoolini Cupid</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="bg-gray-100">
    <!-- Header -->
    <header class="bg-white shadow-sm py-4 px-6 flex justify-between items-center sticky top-0 z-10">
        <h1 class="text-xl font-bold text-pink-500">Settings</h1>
        <button class="text-gray-500">
            <i class="fas fa-cog"></i>
        </button>
    </header>

    <!-- Settings List -->
    <main class="p-4 space-y-4">
        <div class="bg-white rounded-xl shadow p-4">
            <h2 class="font-bold text-lg">Profile</h2>
            <p class="text-gray-600">Edit your profile information</p>
            <a href="setup.html" class="text-pink-500 hover:underline">Edit Profile</a>
        </div>

        <div class="bg-white rounded-xl shadow p-4">
            <h2 class="font-bold text-lg">Notifications</h2>
            <p class="text-gray-600">Manage your notification preferences</p>
            <label class="flex items-center">
                <input type="checkbox" class="form-checkbox h-5 w-5 text-pink-500">
                <span class="ml-2">Receive notifications for matches</span>
            </label>
            <label class="flex items-center">
                <input type="checkbox" class="form-checkbox h-5 w-5 text-pink-500">
                <span class="ml-2">Receive promotional emails</span>
            </label>
        </div>

        <div class="bg-white rounded-xl shadow p-4">
            <h2 class="font-bold text-lg">Account</h2>
            <p class="text-gray-600">Manage your account settings</p>
            <a href="#" class="text-pink-500 hover:underline">Change Password</a>
            <a href="#" class="text-pink-500 hover:underline">Log out</a>
        </div>

        <div class="bg-white rounded-xl shadow p-4">
            <h2 class="font-bold text-lg">Privacy</h2>
            <p class="text-gray-600">Manage your privacy settings</p>
            <a href="#" class="text-pink-500 hover:underline">Blocked Users</a>
            <a href="#" class="text-pink-500 hover:underline">Deactivate Account</a>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around py-3 max-w-md mx-auto">
        <a href="swipe.html" class="text-gray-500">
            <i class="fas fa-fire text-xl"></i>
        </a>
        <a href="explore.html" class="text-gray-500">
            <i class="fas fa-compass text-xl"></i>
        </a>
        <a href="chat.html" class="text-gray-500">
            <i class="fas fa-comment-dots text-xl"></i>
        </a>
        <a href="settings.html" class="text-pink-500">
            <i class="fas fa-user text-xl"></i>
        </a>
    </nav>
</body>
</html>
