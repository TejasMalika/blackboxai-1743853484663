<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Shoolini Cupid</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-pink-100 to-purple-100 h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-lg p-8 w-full max-w-md">
        <div class="text-center mb-8">
            <div class="w-20 h-20 mx-auto mb-4 rounded-full bg-gradient-to-r from-pink-500 to-purple-500 flex items-center justify-center">
                <i class="fas fa-heart text-3xl text-white"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">Welcome Back</h1>
            <p class="text-gray-600">Login with your Shoolini University email</p>
        </div>
        
        <div class="space-y-4">
            <div class="flex items-center justify-center border border-gray-300 rounded-lg px-4 py-3 cursor-pointer hover:bg-gray-50 transition">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google" class="w-5 h-5 mr-3">
                <span class="font-medium text-gray-700">Continue with Google</span>
            </div>
            
            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-gray-300"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-2 bg-white text-gray-500">or</span>
                </div>
            </div>
            
            <div class="bg-red-50 text-red-700 p-3 rounded-lg text-sm hidden" id="errorMessage">
                <i class="fas fa-exclamation-circle mr-2"></i>
                <span id="errorText">Please use your Shoolini University email</span>
            </div>
            
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="email" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-pink-500 outline-none transition">
            </div>
            
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-pink-500 outline-none transition">
            </div>
            
            <button id="loginBtn" class="w-full bg-gradient-to-r from-pink-500 to-purple-500 text-white py-3 rounded-lg font-medium hover:opacity-90 transition flex items-center justify-center">
                <span>Login</span>
                <i class="fas fa-spinner fa-spin ml-2 hidden"></i>
            </button>
        </div>
        
        <p class="text-center text-sm text-gray-500 mt-6">
            By continuing, you agree to our <a href="#" class="text-pink-500 hover:underline">Terms</a> and <a href="#" class="text-pink-500 hover:underline">Privacy Policy</a>
        </p>
    </div>

    <script>
        document.getElementById('loginBtn').addEventListener('click', function() {
            const email = document.getElementById('email').value;
            const errorDiv = document.getElementById('errorMessage');
            const spinner = this.querySelector('i');
            
            // Validate Shoolini University email
            if (!email.endsWith('@shooliniuniversity.com')) {
                errorDiv.classList.remove('hidden');
                return;
            }
            
            // Simulate login
            errorDiv.classList.add('hidden');
            spinner.classList.remove('hidden');
            this.disabled = true;
            
            setTimeout(() => {
                window.location.href = 'setup.html';
            }, 1500);
        });
    </script>
</body>
</html>
